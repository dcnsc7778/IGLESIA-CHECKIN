<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Iglesia Dios Con Nosotros | Registro</title>

  <style>
    :root {
      --black: #000000;
      --gold: #D4AF37;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000000 !important;
      color: var(--white);
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
    }

    .screen {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000000 !important;

      border: 3px solid var(--gold);
      outline: 5px solid #000000;
      outline-offset: -8px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;

      padding: 14px 20px;
      text-align: center;
    }

    .logo-area {
      width: 100%;
      height: 26%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .logo {
      display: block;
      width: min(460px, 94vw);
      max-height: 100%;
      height: auto;
      object-fit: contain;
    }

    h1 {
      color: var(--gold);
      font-size: clamp(26px, 4.6vh, 40px);
      font-weight: bold;
      line-height: 1.1;
      margin: 0;
    }

    .instruction {
      color: var(--white);
      font-size: clamp(17px, 2.7vh, 25px);
      line-height: 1.35;
      max-width: 700px;
      margin: 0;
    }

    .subtitle {
      color: var(--white);
      font-size: clamp(14px, 2vh, 18px);
      margin: 0;
    }

    .scanner-area {
      width: min(100%, 280px);
      height: 29%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #reader {
      width: 100%;
      max-height: 100%;
      overflow: hidden;
    }

    #reader video {
      width: 100% !important;
      max-height: 25vh !important;
      max-height: 25dvh !important;
      object-fit: contain;
    }

    #scanStatus {
      color: var(--gold);
      font-size: clamp(12px, 1.8vh, 16px);
      line-height: 1.3;
      margin: 0;
      overflow-wrap: anywhere;
    }

    .verse {
      color: var(--gold) !important;
      font-size: clamp(13px, 2vh, 18px);
      line-height: 1.35;
      max-width: 700px;
      margin: 0;
    }

    .verse p {
      color: var(--gold) !important;
      margin: 3px 0;
    }

    .verse-reference {
      color: var(--gold) !important;
      font-size: clamp(12px, 1.7vh, 15px);
      font-weight: bold;
      letter-spacing: 1px;
    }

    @media (max-height: 650px) {
      .screen {
        padding: 9px 14px;
      }

      .logo-area {
        height: 23%;
      }

      .scanner-area {
        height: 27%;
        width: min(100%, 240px);
      }

      #reader video {
        max-height: 23dvh !important;
      }
    }

    @media (max-width: 480px) {
      .screen {
        padding: 10px 14px;
      }

      .logo {
        width: min(400px, 94vw);
      }

      .instruction {
        font-size: clamp(15px, 2.5vh, 20px);
      }
    }
  </style>
</head>

<body>
  <main class="screen">

    <div class="logo-area">
      <img
        class="logo"
     src="iglesia_logo_cropped.png"
   alt="Iglesia Dios Con Nosotros"
      >
    </div>
    <button
  id="adminButton"
  type="button"
  style="background:transparent; color:#D4AF37; border:1px solid #D4AF37; border-radius:8px; padding:8px 14px; cursor:pointer; margin:12px auto;"
>
  ⚙️ Administración
</button>
<div id="admin-service-setup" hidden style="display:none; margin:12px auto; text-align:center;">
    <label for="serviceType" style="color:#d4af37;">
    Tipo de culto:
  </label>
  <select id="serviceType">
    <option value="">Seleccione el culto</option>
    <option>Evangelistico</option>
    <option>Damas</option>
    <option>Caballeros</option>
    <option>Niños</option>
    <option>Jovenes</option>
    <option>Misiones</option>
    <option>Pro templo</option>
    <option>Evangelismo</option>
    <option>Campaña</option>
    <option>Sorpresa</option>
    <option>Addicional</option>
    <option>Oracion</option>
    <option>Oracion y Estudio</option>
  </select>
  <button
  id="startServiceButton"
  type="button"
  style="display:block; margin:15px auto; padding:12px 24px; background:#D4AF37; color:#172033; border:none; border-radius:8px; font-weight:bold; cursor:pointer;"
>
  Iniciar Registro
</button>
</div>
    <h1>¡BIENVENIDOS!</h1>
<div
  id="activeService"
  style="color:#D4AF37; font-size:16px; font-weight:500; text-align:center; margin:10px auto;"
  hidden
></div>
    <p class="instruction">
      Escanee su tarjeta de membresía
      para registrar su asistencia.
    </p>

    <p class="subtitle">
      Registro de miembros y familias
    </p>

    <div class="scanner-area">
      <div id="reader"></div>
    </div>

    <p id="scanStatus" aria-live="polite">
      Preparando cámara...
    </p>

    <div class="verse">
      <p>
        “Yo me alegré con los que me decían:
        A la casa de Jehová iremos.”
      </p>
      <p class="verse-reference">
        SALMOS 122:1
      </p>
    </div>

  </main>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <script>
    const status = document.getElementById("scanStatus");
    let lastScan = "";

    async function startScanner() {
      if (typeof Html5Qrcode === "undefined") {
        status.textContent = "No se pudo cargar el escáner.";
        return;
      }

      const scanner = new Html5Qrcode("reader");

      try {
        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 180, height: 180 }
          },
          (decodedText) => {
            if (decodedText === lastScan) return;

            lastScan = decodedText;
            status.textContent =
              "Código detectado: " + decodedText;
          },
          () => {}
        );

        status.textContent =
          "Cámara lista. Escanee su tarjeta.";

      } catch (error) {
        status.textContent =
          "No se pudo iniciar la cámara: " + error;
      }
    }

    window.addEventListener("load", startScanner);
  </script>
  <script>
document.getElementById("adminButton").addEventListener("click", function () {
  const setup = document.getElementById("admin-service-setup");

  if (setup.hidden) {
    setup.hidden = false;
    setup.style.display = "block";
  } else {
    setup.hidden = true;
    setup.style.display = "none";
  }
});
</script>
  <script>
document.getElementById("startServiceButton").addEventListener("click", function () {
  const service = document.getElementById("serviceType").value;

  if (!service) {
    alert("Por favor, seleccione un culto.");
    return;
  }

  sessionStorage.setItem("selectedService", service);
  const activeService = document.getElementById("activeService");
activeService.textContent = "Culto: " + service;
activeService.hidden = false;
document.getElementById("adminButton").style.display = "none";

  document.getElementById("admin-service-setup").hidden = true;
  document.getElementById("admin-service-setup").style.display = "none";

  alert("Registro preparado para: " + service);
});
</script>
  <script>
document.addEventListener("DOMContentLoaded", function () {
  const savedService = sessionStorage.getItem("selectedService");

  if (savedService) {
    const activeService = document.getElementById("activeService");
    activeService.textContent = "Culto: " + savedService;
    activeService.hidden = false;

    document.getElementById("adminButton").style.display = "none";
  }
});
</script>
</body>
</html>
